apply plugin: 'com.android.application'

android {

    compileSdkVersion 30
    sourceSets { main { jni.srcDirs = [ 'src/main/jniLibs'] } }
    defaultConfig {
        applicationId "com.gpsdk.demo"
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        ndk{
            abiFilters 'arm64-v8a','x86_64','x86','armeabi-v7a'
            moduleName "libserial_port_gp"
            ldLibs "log", "z", "m", "jnigraphics", "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('com.android.support.test.espresso:espresso-core:3.0.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    testImplementation 'junit:junit:4.13.2'
    implementation files('libs/zxingcore.jar')
    implementation files('libs/printersdk.jar')
}
